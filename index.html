<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexik — Транспортные новости</title>
    <style>
        /* ── RESET & BASE ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0b0e14;
            color: #f0f4fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px 40px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(20, 26, 36, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px 20px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        /* анимированный градиентный фон (за body) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg, #0b0e14 0%, #1a1f2b 40%, #0f1a2b 80%, #0b0e14 100%);
            background-size: 400% 400%;
            animation: gradShift 18s ease infinite;
        }
        @keyframes gradShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a3344;
            border: 2px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .title-group h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #b0c7ff, #7aa9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .title-group p {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        /* ── PROGRESS BLOCK ── */
        .goal-block {
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 18px 16px 20px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .goal-block p {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .progress-bar {
            flex: 1;
            height: 10px;
            background: #2a3344;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
        }
        .progress-fill {
            width: 94%;
            height: 100%;
            background: linear-gradient(90deg, #3b8eff, #7aa9ff);
            border-radius: 20px;
            transition: width 0.4s ease;
            box-shadow: 0 0 12px rgba(59, 142, 255, 0.4);
        }
        .progress-label {
            font-size: 15px;
            font-weight: 600;
            color: #b0c7ff;
            white-space: nowrap;
        }

        /* ── STATUS LINES ── */
        .status-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin-bottom: 28px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 16px 14px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71aa;
            flex-shrink: 0;
        }
        .status-item span:last-child {
            opacity: 0.7;
            font-weight: 400;
            font-size: 13px;
            margin-left: auto;
            color: #8fadcc;
        }

        /* ── MAP BUTTONS ── */
        .map-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        .map-btn {
            flex: 1;
            padding: 14px 0;
            background: rgba(59, 142, 255, 0.15);
            border: 1px solid rgba(59, 142, 255, 0.25);
            border-radius: 16px;
            color: #b0c7ff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.3px;
        }
        .map-btn:active { transform: scale(0.97); background: rgba(59, 142, 255, 0.3); }

        /* ── NAV BUTTONS (Telegram) ── */
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }
        .nav-btn {
            padding: 14px 0;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: #e8edf5;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.08); }
        .nav-btn small {
            font-size: 10px;
            opacity: 0.5;
            font-weight: 400;
        }

        /* ── EXTERNAL LINKS ── */
        .ext-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .ext-links a {
            color: #8fadcc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: color 0.2s;
            border-bottom: 1px dotted transparent;
        }
        .ext-links a:active { color: #b0c7ff; border-color: #b0c7ff; }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            position: relative;
            max-width: 100%;
            max-height: 90vh;
            background: #141c26;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .modal-content img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            background: #0b0e14;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 34px;
            line-height: 1;
            color: #ffffffdd;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            font-weight: 300;
            backdrop-filter: blur(4px);
        }
        .modal-close:active { background: rgba(255,255,255,0.2); }

        /* ── RESPONSIVE ── */
        @media (max-width: 420px) {
            .container { padding: 18px 14px 24px; }
            .header { gap: 12px; }
            .avatar { width: 60px; height: 60px; }
            .title-group h1 { font-size: 22px; }
            .status-list { grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 12px 10px; }
            .nav-grid { grid-template-columns: 1fr 1fr; }
            .nav-grid .nav-btn:last-child { grid-column: span 2; }
            .map-buttons { flex-direction: column; }
        }
        @media (max-width: 380px) {
            .status-list { grid-template-columns: 1fr; }
        }
        /* маленький хак для iPhone */
        .modal-overlay { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <img class="avatar" src="https://t.me/Nexik3/photo" alt="Nexik" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%232a3344%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%238fadcc%22 font-size=%2240%22 font-family=%22Arial%22%3EN%3C/text%3E%3C/svg%3E'">
        <div class="title-group">
            <h1>Nexik</h1>
            <p>Транспортные новости</p>
        </div>
    </div>

    <!-- GOAL + PROGRESS -->
    <div class="goal-block">
        <p>🚇 Интересный канал о транспорте, расписаниях, развитии сети и городской мобильности. Присоединяйся!</p>
        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-fill" style="width:94%"></div>
            </div>
            <span class="progress-label">47 / 50</span>
        </div>
    </div>

    <!-- STATUS LINES -->
    <div class="status-list">
        <div class="status-item"><span class="status-dot"></span> D1 <span>Штатно</span></div>
        <div class="status-item"><span class="status-dot"></span> D2 <span>Штатно</span></div>
        <div class="status-item"><span class="status-dot"></span> D3 <span>Штатно</span></div>
        <div class="status-item"><span class="status-dot"></span> D4 <span>Штатно</span></div>
        <div class="status-item" style="grid-column: span 2;"><span class="status-dot"></span> Метрополитен <span>Штатно</span></div>
    </div>

    <!-- MAP BUTTONS -->
    <div class="map-buttons">
        <div class="map-btn" data-map="metro">🗺️ Карта Метро</div>
        <div class="map-btn" data-map="mcd">🗺️ Карта МЦД</div>
    </div>

    <!-- TELEGRAM NAV -->
    <div class="nav-grid">
        <a class="nav-btn" href="tg://resolve?domain=Nexik3">📢 Канал <small>читать</small></a>
        <a class="nav-btn" href="tg://resolve?domain=Nexik_predlozhka_bot">🤖 Бот <small>предложка</small></a>
        <a class="nav-btn" href="tg://resolve?domain=Nexik3&boost">⭐ Проголосовать</a>
    </div>

    <!-- EXTERNAL LINKS -->
    <div class="ext-links">
        <a href="https://vk.ru" target="_blank">VK</a>
        <a href="https://youtube.com" target="_blank">YouTube</a>
        <a href="https://max.ru" target="_blank">МАКС</a>
        <a href="https://transphoto.org" target="_blank">TransPhoto</a>
    </div>
</div>

<!-- MODAL OVERLAY -->
<div class="modal-overlay" id="mapModal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">✕</button>
        <img id="modalImage" src="" alt="Схема">
    </div>
</div>

<script>
    (function() {
        // ссылки на картинки (стабильные, из Википедии)
        const MAPS = {
            metro: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Moscow_metro_map_en.svg/1280px-Moscow_metro_map_en.svg.png',
            mcd: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Moscow_Central_Diameters_map.svg/1280px-Moscow_Central_Diameters_map.svg.png'
        };

        const modal = document.getElementById('mapModal');
        const modalImg = document.getElementById('modalImage');
        const closeBtn = document.getElementById('modalClose');

        // открытие по кнопкам
        document.querySelectorAll('.map-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const key = this.dataset.map;
                if (MAPS[key]) {
                    modalImg.src = MAPS[key];
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden'; // блокируем скролл
                }
            });
            // для тактильной отзывчивости на iPhone
            btn.addEventListener('touchstart', function(e) {
                // ничего не делаем, просто чтобы активное состояние сработало
            }, { passive: true });
        });

        // закрытие по крестику
        closeBtn.addEventListener('click', closeModal);
        closeBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            closeModal();
        }, { passive: false });

        // закрытие по фону (клик на overlay)
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });
        modal.addEventListener('touchstart', function(e) {
            if (e.target === modal) {
                e.preventDefault();
                closeModal();
            }
        }, { passive: false });

        // также закрытие по Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            // не сбрасываем src, чтобы не мигало при повторном открытии
        }

        // предотвращаем скролл под модалкой на iOS
        modal.addEventListener('touchmove', function(e) {
            if (e.target === modal) e.preventDefault();
        }, { passive: false });
    })();
</script>
</body>
</html>
