<div style="max-width: 600px; margin: 0 auto; background: #1a1a1a; border-radius: 16px; padding: 20px; font-family: system-ui;">

    <!-- Шапка -->
    <div style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2a2a2a; padding-bottom: 16px; margin-bottom: 16px;">
        <div style="width: 48px; height: 48px; background: #2b5278; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: bold;">N</div>
        <div>
            <div style="color: white; font-weight: bold; font-size: 18px;">Nexik</div>
            <div style="color: #8e8e93; font-size: 13px;">Транспортные новости</div>
        </div>
    </div>

    <!-- Посты -->
    <div id="posts" style="color: #e5e5ea; font-size: 15px; line-height: 1.6;">
        <div style="text-align: center; padding: 40px 0; color: #8e8e93;">⏳ Загрузка постов...</div>
    </div>

    <!-- Кнопка -->
    <div style="margin-top: 16px; text-align: center;">
        <a href="https://t.me/Nexik3" target="_blank" style="display: inline-block; background: #0088cc; color: white; padding: 12px 32px; border-radius: 24px; text-decoration: none; font-weight: 600; font-size: 15px;">📱 Подписаться в Telegram</a>
    </div>
</div>

<script>
const BOT_TOKEN = '8778639653:AAGT77go4sOQsouN6ZZZopqEv6w-xnGXn4k';

async function loadPosts() {
    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
        const data = await response.json();
        const container = document.getElementById('posts');

        if (data.ok && data.result.length > 0) {
            const posts = data.result.filter(u => u.channel_post);
            if (posts.length === 0) {
                container.innerHTML = `<div style="background: #2c2c2e; border-radius: 12px; padding: 14px 16px; color: #8e8e93;">📢 Новых постов пока нет</div>`;
                return;
            }
            let html = '';
            posts.slice(-10).reverse().forEach(post => {
                const msg = post.channel_post;
                const date = new Date(msg.date * 1000);
                const dateStr = date.toLocaleDateString('ru-RU') + ' ' + date.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
                const text = msg.text || msg.caption || '📷 Медиа-пост';
                html += `
                    <div style="background: #2c2c2e; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;">
                        <div style="color: #8e8e93; font-size: 12px; margin-bottom: 6px;">${dateStr}</div>
                        <div style="color: #e5e5ea;">${text}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } else {
            showExamplePosts();
        }
    } catch (error) {
        showExamplePosts();
    }
}

function showExamplePosts() {
    document.getElementById('posts').innerHTML = `
        <div style="background: #2c2c2e; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;">
            <div style="color: #8e8e93; font-size: 12px; margin-bottom: 6px;">Сегодня, 12:34</div>
            <div style="color: #e5e5ea;">🚆 Новый маршрут запущен в Москве!</div>
        </div>
        <div style="background: #2c2c2e; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;">
            <div style="color: #8e8e93; font-size: 12px; margin-bottom: 6px;">Вчера, 18:20</div>
            <div style="color: #e5e5ea;">🚌 Обновление расписания на маршруте №42</div>
        </div>
        <div style="text-align: center; padding: 12px 0; color: #8e8e93; font-size: 13px;">💬 Реальные посты подгрузятся автоматически</div>
    `;
}

loadPosts();
</script>
